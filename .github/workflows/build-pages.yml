# Nightly rebuild of the public wine and store pages from the live database (free, no secrets:
# uses the same public read-only key the app already ships in config.js).
name: Build wine and store pages
on:
  schedule:
    - cron: '7 6 * * *'   # 02:07 Aruba, after the Cellar Writer has written new content
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build-pages.mjs', '.github/workflows/build-pages.yml']
permissions:
  contents: write
concurrency: { group: build-pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/build-pages.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit changes
        run: |
          git config user.name "ob-pages-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wine store sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Nightly page build $(date -u +%F)"
          git push
